[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vlmbench"
version = "1.0.0"
description = "Vision-language models on multimodal disease classification: inference code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pillow"]

[tool.setuptools.packages.find]
include = ["vlmbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
